name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        shell: bash
        run: |
          if [[ -f NHSeries/gradlew ]]; then
            cd NHSeries
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif [[ -f gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif [[ -f NHSeries/build.gradle && -f NHSeries/settings.gradle ]]; then
            gradle -p NHSeries --no-daemon assembleDebug
          elif [[ -f build.gradle && -f settings.gradle ]]; then
            gradle --no-daemon assembleDebug
          else
            echo "Android Gradle project files not found. Upload the NHSeries source folder first."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NHSeries-debug-apk
          path: |
            NHSeries/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
